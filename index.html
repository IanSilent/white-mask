<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The White Mask</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Cormorant+SC:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { --gold:#c9a24a; --ink:#ece3d0; --dim:#8d8371; --bg:#0b070d; --blood:#a8262b; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:#000; overflow:hidden; }
  body { font-family:'Cormorant Garamond', Georgia, 'Times New Roman', serif; color:var(--ink); }
  #stage { position:absolute; left:50%; top:50%; width:1280px; height:720px; transform-origin:0 0; overflow:hidden; background:var(--bg); }
  canvas#cv { position:absolute; inset:0; display:block; }
  .sc { font-family:'Cormorant SC', Georgia, serif; letter-spacing:.08em; }
  button { font:inherit; color:inherit; cursor:pointer; }

  #hud { position:absolute; left:18px; top:14px; display:flex; gap:10px; z-index:5; }
  .chip { background:rgba(10,6,12,.72); border:1px solid rgba(201,162,74,.55); padding:5px 14px; font-size:19px; border-radius:2px; }
  .chip:hover { background:rgba(60,40,20,.8); }
  #prompt { position:absolute; left:0; right:0; bottom:26px; text-align:center; font-size:22px; pointer-events:none; text-shadow:0 2px 6px #000; opacity:0; transition:opacity .2s; }
  #prompt b { color:var(--gold); border:1px solid var(--gold); padding:0 8px; margin-right:8px; font-weight:500; }
  #toast { position:absolute; left:50%; top:74px; transform:translateX(-50%); background:rgba(10,6,12,.9); border:1px solid var(--gold); color:var(--gold); padding:6px 20px; font-size:20px; opacity:0; transition:opacity .3s; pointer-events:none; z-index:30; }

  #dlg { position:absolute; left:20px; right:20px; bottom:16px; height:292px; display:none; gap:18px; padding:14px; z-index:10;
         background:linear-gradient(180deg, rgba(20,12,22,.96), rgba(8,5,10,.97)); border:1px solid var(--gold); outline:1px solid rgba(201,162,74,.35); outline-offset:4px; }
  #dlg.on { display:flex; }
  #port { width:260px; height:360px; flex:none; align-self:flex-end; margin:-110px -8px -14px -10px; pointer-events:none; }
  #dmain { flex:1; min-width:0; display:flex; flex-direction:column; }
  #dname { color:var(--gold); font-size:25px; margin-bottom:4px; }
  #dtext { font-size:24px; line-height:1.28; overflow-y:auto; flex:1; padding-right:8px; }
  #dtext.fade { animation:fade .45s ease; }
  @keyframes fade { from { opacity:0; transform:translateY(4px);} to { opacity:1; } }
  .slip { border-bottom:1px dotted rgba(201,162,74,.75); cursor:pointer; animation:glim 2.4s ease-in-out infinite; }
  .slip:hover { color:#ffe6a6; }
  .slip.got { color:var(--gold); border-bottom:1px solid var(--gold); animation:none; cursor:default; }
  @keyframes glim { 0%,100% { text-shadow:none; } 50% { text-shadow:0 0 9px rgba(255,214,130,.75); } }
  #dch { width:340px; flex:none; display:flex; flex-direction:column; gap:4px; overflow-y:auto; padding-right:4px; }
  #dq { color:var(--dim); font-style:italic; font-size:19px; }
  .ch { text-align:left; background:rgba(201,162,74,.07); border:1px solid rgba(201,162,74,.35); padding:4px 12px; font-size:19px; line-height:1.15; border-radius:2px; }
  .ch:hover { background:rgba(201,162,74,.22); border-color:var(--gold); }
  .ch.new::before { content:'◆ '; color:var(--gold); }
  .ch.soft { color:var(--dim); }
  .ch small { display:block; color:var(--dim); font-size:15px; }
  .recap { margin:4px 0 0; padding-left:26px; font-size:18.5px; line-height:1.18; }
  .recap li { margin-bottom:3px; }
  .recap li.off { color:#6a6258; }
  .recap li.on { color:#ffe6a6; }

  #toast.bad { border-color:var(--blood); color:#ffb0a0; font-size:26px; padding:10px 30px; top:110px; box-shadow:0 0 40px rgba(168,38,43,.7); }
  #candles { position:absolute; right:14px; top:6px; width:196px; height:62px; z-index:6; cursor:help; }
  #ctip { display:none; position:absolute; right:0; top:66px; width:330px; background:rgba(10,6,12,.95); border:1px solid var(--gold); padding:10px 14px; font-size:19px; line-height:1.25; }
  #candles:hover #ctip { display:block; }
  #dlg.other { border-color:var(--blood); outline-color:rgba(168,38,43,.5); background:linear-gradient(180deg, rgba(44,4,9,.96), rgba(6,0,2,.98)); animation:shiver 5s infinite; }
  #dlg.other #dname { color:#e8dcc8; letter-spacing:.42em; }
  #dlg.other { height:346px; }
  #dlg.other #dtext { font-size:21px; line-height:1.2; }
  #dtext, #dch, #book .col { scrollbar-width:thin; scrollbar-color:#5a4a2a transparent; }
  #dlg.other .slip { border-bottom-color:#e8dcc8; }
  .ol { margin:0 0 7px; opacity:0; animation:seep 1.2s forwards; }
  .ol:nth-child(3n) { padding-left:30px; }
  .ol.echo { font-style:italic; color:#d0858a; padding-left:90px; font-size:20px; letter-spacing:.07em; }
  @keyframes seep { from { opacity:0; filter:blur(7px); letter-spacing:.25em; } to { opacity:1; filter:blur(0); } }
  @keyframes shiver { 0%,91%,100% { transform:none; } 93% { transform:translateX(4px) skewX(-.7deg); } 95% { transform:translateX(-3px); } 97% { transform:translateY(2px); } }
  .overlay { position:absolute; inset:0; display:none; z-index:20; background:rgba(5,3,7,.9); }
  .overlay.on { display:flex; }
  #book { padding:26px 60px 22px; gap:44px; }
  #book h2 { margin:0 0 8px; color:var(--gold); font-size:28px; font-weight:500; }
  #book .col { flex:1; overflow-y:auto; }
  .nm { margin-bottom:7px; font-size:20px; line-height:1.14; }
  .nm b { font-size:23px; }
  .nm i { color:var(--dim); }
  .nm .st { color:var(--dim); font-size:18px; }
  .nm.known { display:flex; gap:14px; align-items:center; padding:3px 12px; border:1px solid var(--gold); background:linear-gradient(90deg, rgba(201,162,74,.2), rgba(201,162,74,.04)); box-shadow:0 0 18px rgba(201,162,74,.18); }
  .nm.known b { color:#ffe6a6; }
  .nm.known .st { color:var(--gold); font-size:20px; }
  .nm.known canvas { flex:none; background:rgba(0,0,0,.45); border:1px solid rgba(201,162,74,.5); }
  .sl { margin-bottom:9px; font-size:20px; line-height:1.2; }
  .sl span { color:var(--gold); font-size:17px; display:block; }
  .sl.gone { color:var(--dim); font-style:italic; border-top:1px solid rgba(201,162,74,.25); padding-top:8px; margin-top:12px; }
  #bookx { position:absolute; right:28px; top:20px; }

  #title, #end { flex-direction:column; align-items:center; justify-content:center; text-align:center; background:radial-gradient(ellipse at 50% 40%, #2a0f16 0%, #0a0509 70%); }
  #title h1, #end h1 { font-size:92px; margin:0; font-weight:500; color:#f3ecdc; text-shadow:0 0 40px rgba(168,38,43,.6); }
  #title p, #end p { font-size:25px; color:var(--dim); margin:10px 0 26px; }
  #tmask { width:200px; height:230px; margin-bottom:6px; }
  .big { font-size:28px; padding:9px 40px; background:rgba(168,38,43,.25); border:1px solid var(--gold); }
  .big:hover { background:rgba(168,38,43,.55); }
  #langs { margin-bottom:22px; display:flex; gap:10px; justify-content:center; }
  #langs .chip.sel { background:var(--gold); color:#1a1008; }
  #how { font-size:19px !important; margin-top:26px !important; }
  #stats { font-size:24px; color:var(--ink); line-height:1.5; margin-bottom:24px; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" width="1280" height="720"></canvas>
  <div id="hud">
    <button class="chip sc" id="bbook"></button>
    <button class="chip sc" id="blang"></button>
  </div>
  <div id="candles"><div id="ctip"></div></div>
  <div id="prompt"></div>
  <div id="toast"></div>

  <div id="dlg">
    <canvas id="port" width="260" height="360"></canvas>
    <div id="dmain">
      <div id="dname" class="sc"></div>
      <div id="dtext"></div>
    </div>
    <div id="dch"></div>
  </div>

  <div id="book" class="overlay">
    <button class="chip sc" id="bookx"></button>
    <div class="col"><h2 class="sc" id="bh1"></h2><div id="bnames"></div></div>
    <div class="col"><h2 class="sc" id="bh2"></h2><div id="bslips"></div></div>
  </div>

  <div id="title" class="overlay on">
    <canvas id="tmask" width="200" height="230"></canvas>
    <h1 class="sc" id="t1"></h1>
    <p id="t2"></p>
    <div id="langs"><button class="chip sc" data-l="ru">Русский</button><button class="chip sc" data-l="en">English</button></div>
    <button class="big sc" id="bstart"></button>
    <p id="how"></p>
  </div>

  <div id="end" class="overlay">
    <h1 class="sc" id="e1"></h1>
    <p></p>
    <div id="stats"></div>
    <button class="big sc" id="bagain"></button>
  </div>
</div>
<script src="story.js?v=1795355064"></script>
<script src="game.js?v=1795355064"></script>
<script src="figures.js?v=1795355064"></script>
<script src="light.js?v=1795355064"></script>
<script src="depth.js?v=1795355064"></script>
<script src="portraits.js?v=1795355064"></script>
</body>
</html>
